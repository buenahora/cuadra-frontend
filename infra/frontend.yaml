AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Frontend de la plataforma de alquileres. Bucket S3 privado con el build de React y
  una distribución de CloudFront con dos orígenes, S3 para /* y el ALB para /api/*.
  Se despliega después del stack del backend, porque lee el secreto del header de origen.

Parameters:
  Project:
    Type: String
    Default: alquileres
  Environment:
    Type: String
    Default: prd
    AllowedValues: [dev, prd]
  # Los tres van vacíos mientras no haya dominio propio. En ese modo
  # CloudFront sirve el sitio en su propio nombre (dxxxx.cloudfront.net) con el
  # certificado que trae AWS: HTTPS válido para el visitante, sin comprar nada
  # y sin renovaciones. Ver "Sin dominio todavía" en el README del backend.
  SiteDomainName:
    Type: String
    Default: ''
    Description: Dominio público del sitio, por ejemplo www.midominio.com. Vacío = se usa el dominio de CloudFront
  OriginDomainName:
    Type: String
    Default: ''
    Description: Nombre DNS del ALB con certificado propio, por ejemplo origin.midominio.com. Vacío = se usa el DNS del ALB directo
  CertificateArn:
    Type: String
    Default: ''
    Description: ARN del certificado ACM de SiteDomainName, en us-east-1. Vacío = certificado por defecto de CloudFront

Conditions:
  ConDominioPropio: !Not [!Equals [!Ref SiteDomainName, '']]
  # Si hay un nombre de origen propio es porque el ALB tiene certificado, así
  # que CloudFront le habla HTTPS. Si no, le habla HTTP al DNS del ALB -- ver
  # el comentario del origen `api` más abajo.
  ConOrigenPropio: !Not [!Equals [!Ref OriginDomainName, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-site-${AWS::AccountId}'
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: versiones-viejas
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Project}-${Environment}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloCloudFront
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # La API no se cachea. El TTL máximo de 1 segundo es lo que permite incluir el header
  # Authorization en la política, para que CloudFront lo reenvíe al ALB.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${Project}-${Environment}-api'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          QueryStringsConfig: {QueryStringBehavior: all}
          CookiesConfig: {CookieBehavior: none}

  # Las rutas del React (sin extensión) se resuelven a index.html
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${Project}-${Environment}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Reescribe rutas de la SPA a index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (!request.uri.includes('.')) {
            request.uri = '/index.html';
          }
          return request;
        }

  # CloudFront le manda al ALB la ruta completa (/api/zones), pero la app no
  # sirve ese prefijo: --root-path solo le dice a FastAPI bajo qué prefijo está
  # montada para generar links y docs correctos, no agrega prefijo de ruteo --
  # sacarlo es trabajo del proxy. Sin esto /api/health da 404 aunque /health
  # responda 200, y la API entera queda inalcanzable desde el sitio.
  #
  # Con substring y no con regex: así no depende de qué soporta el runtime de
  # CloudFront Functions.
  ApiRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${Project}-${Environment}-api-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Saca el prefijo /api antes de mandar el request al ALB
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/api' || request.uri === '/api/') {
            request.uri = '/';
          } else if (request.uri.indexOf('/api/') === 0) {
            request.uri = request.uri.substring(4);
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    # W1030: cfn-lint resuelve Ref CertificateArn con su default ('') y se
    # queja de que no tiene forma de ARN de ACM. Es un falso positivo: ese Ref
    # solo se evalúa dentro del !If de ConDominioPropio, o sea cuando el
    # parámetro viene cargado. Sin esto el warning hace fallar el paso de
    # cfn-lint del CI (cfn-lint sale con 4 ante un warning, no con 0).
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${Project}-${Environment}'
        Aliases: !If [ConDominioPropio, [!Ref SiteDomainName], !Ref 'AWS::NoValue']
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        ViewerCertificate: !If
          - ConDominioPropio
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          # El certificado de *.cloudfront.net, que AWS mantiene y renueva.
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {OriginAccessIdentity: ''}
          # Sin dominio propio el ALB no puede tener certificado (no hay nombre
          # que certificar), así que escucha en 80 y CloudFront le habla HTTP
          # -- ver el parámetro OriginCertificateArn de infra/backend.yaml del
          # repo del backend.
          #
          # OJO: en ese modo el salto CloudFront -> ALB va sin cifrar, y con él
          # el header secreto X-Origin-Verify. El security group del ALB solo
          # acepta la prefix list de CloudFront, así que nadie más llega, pero
          # el tramo igual viaja en claro. Es aceptable para probar; para
          # producción de verdad hay que cargar el certificado.
          - Id: api
            DomainName: !If
              - ConOrigenPropio
              - !Ref OriginDomainName
              - Fn::ImportValue: !Sub '${Project}-${Environment}-AlbDnsName'
            CustomOriginConfig: !If
              - ConOrigenPropio
              - OriginProtocolPolicy: https-only
                HTTPSPort: 443
                OriginSSLProtocols: [TLSv1.2]
              - OriginProtocolPolicy: http-only
                HTTPPort: 80
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${Project}/${Environment}/origin-verify:SecretString:value}}'
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiRewriteFunction.FunctionMetadata.FunctionARN

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Apuntar SiteDomainName con un CNAME a este valor
    Value: !GetAtt Distribution.DomainName
