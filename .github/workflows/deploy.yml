# Deploy del frontend a AWS (stack alquileres-<env>-frontend).
#
# Pasos, en el orden del runbook (infra/README.md):
#   1. lint + build, con UserPoolId/UserPoolClientId leídos del stack del backend
#   2. cloudformation deploy de infra/frontend.yaml  <-- la infra siempre se aplica acá
#   3. s3 sync del build al bucket del sitio + invalidación de CloudFront
#
# Autenticación: OIDC, sin claves. Necesita los secrets AWS_DEPLOY_ROLE_ARN y
# CFN_EXEC_ROLE_ARN (outputs del stack base) y las variables de repo
# SITE_DOMAIN_NAME, ORIGIN_DOMAIN_NAME y SITE_CERTIFICATE_ARN.
#
# Además, el secret VITE_CARTO_API_KEY para los tiles del mapa.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos deploys en paralelo sobre el mismo stack se pisan: CloudFormation
# rechaza el segundo y el s3 sync podría subir un build viejo.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT: ${{ vars.PROJECT || 'alquileres' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'prd' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chequear configuración del repo
        run: |
          set -euo pipefail
          faltan=()
          [[ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]] || faltan+=("secret AWS_DEPLOY_ROLE_ARN")
          [[ -n "${{ secrets.CFN_EXEC_ROLE_ARN }}" ]]   || faltan+=("secret CFN_EXEC_ROLE_ARN")
          # Las tres de dominio son opcionales: sin ellas CloudFront sirve el
          # sitio en su propio nombre (dxxxx.cloudfront.net) con el certificado
          # que trae AWS. Ver infra/frontend.yaml. Avisar, no frenar.
          if [[ -z "${{ secrets.VITE_CARTO_API_KEY }}" ]]; then
            echo '!! sin VITE_CARTO_API_KEY: los mapas van a mostrar el cartel'
            echo '   "API KEY REQUIRED" de CARTO. Ver .env.example.'
          fi
          if [[ -z "${{ vars.SITE_DOMAIN_NAME }}" ]]; then
            echo '!! sin SITE_DOMAIN_NAME: el sitio queda en el dominio de CloudFront.'
            echo '   El salto CloudFront -> ALB va sin TLS mientras no haya certificado.'
          fi
          if (( ${#faltan[@]} )); then
            printf 'Falta configurar en este repo:\n'
            printf '  - %s\n' "${faltan[@]}"
            echo 'Ver infra/README.md.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # El Cognito que usa el frontend lo crea el stack del backend. Se lee de
      # sus outputs en vez de duplicarlo como variable del repo, así no queda
      # desincronizado si el backend recrea el user pool.
      - name: Leer Cognito del stack del backend
        id: backend
        run: |
          set -euo pipefail
          outs=$(aws cloudformation describe-stacks \
            --stack-name "$PROJECT-$ENVIRONMENT-backend" \
            --query 'Stacks[0].Outputs' --output json)
          get() { echo "$outs" | jq -r --arg k "$1" '.[] | select(.OutputKey==$k) | .OutputValue'; }
          echo "user_pool_id=$(get UserPoolId)"         >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$(get UserPoolClientId)" >> "$GITHUB_OUTPUT"
          echo "auth_domain=$(get AuthDomain)"             >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # Relativa a propósito: CloudFront sirve el sitio y manda /api/* al ALB
          # del backend desde la misma distribución (ver infra/frontend.yaml),
          # así que el navegador resuelve esto contra el origen de la página.
          # Sirve igual con dominio propio o con el de CloudFront, y evita
          # tener que conocer el nombre de la distribución antes de crearla.
          VITE_API_BASE_URL: /api
          VITE_COGNITO_USER_POOL_ID: ${{ steps.backend.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.backend.outputs.user_pool_client_id }}
          # Con el dominio cargado el frontend manda el login al hosted UI en
          # vez del formulario propio. Se deja vacío hasta que el pool tenga
          # el proveedor de Google y el backend esté con EnableCognitoAuth en
          # true, para no mandar gente a una pantalla que todavía no sirve.
          VITE_COGNITO_DOMAIN: ${{ vars.ENABLE_COGNITO_AUTH == 'true' && steps.backend.outputs.auth_domain || '' }}
          # Tiles del mapa base. CARTO responde 200 sin key, pero manda una
          # imagen que dice "API KEY REQUIRED": si falta, el mapa se ve roto y
          # el deploy pasa igual, por eso se chequea arriba.
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
        run: npm run build

      - name: CloudFormation deploy (frontend)
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$PROJECT-$ENVIRONMENT-frontend" \
            --template-file infra/frontend.yaml \
            --role-arn "${{ secrets.CFN_EXEC_ROLE_ARN }}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --tags Project="$PROJECT" Environment="$ENVIRONMENT" Repo=cuadra-frontend \
            --parameter-overrides \
              Project="$PROJECT" \
              Environment="$ENVIRONMENT" \
              ${{ vars.SITE_DOMAIN_NAME && format('SiteDomainName={0}', vars.SITE_DOMAIN_NAME) || '' }} \
              ${{ vars.ORIGIN_DOMAIN_NAME && format('OriginDomainName={0}', vars.ORIGIN_DOMAIN_NAME) || '' }} \
              ${{ vars.SITE_CERTIFICATE_ARN && format('CertificateArn={0}', vars.SITE_CERTIFICATE_ARN) || '' }}

      - name: Leer outputs del stack
        id: stack
        run: |
          set -euo pipefail
          outs=$(aws cloudformation describe-stacks \
            --stack-name "$PROJECT-$ENVIRONMENT-frontend" \
            --query 'Stacks[0].Outputs' --output json)
          get() { echo "$outs" | jq -r --arg k "$1" '.[] | select(.OutputKey==$k) | .OutputValue'; }
          echo "bucket=$(get SiteBucketName)"       >> "$GITHUB_OUTPUT"
          echo "distribution=$(get DistributionId)" >> "$GITHUB_OUTPUT"

      - name: Publicar el build
        run: |
          set -euo pipefail
          # Los assets con hash en el nombre se cachean fuerte; index.html no,
          # porque es el que apunta a la versión nueva de los assets.
          aws s3 sync dist/ "s3://${{ steps.stack.outputs.bucket }}" \
            --delete --exclude index.html \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist/index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
            --cache-control 'no-cache'
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths /index.html
